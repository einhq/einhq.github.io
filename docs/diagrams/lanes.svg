<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" width="800" height="316">
  <title>The lanes of the Sort tab</title>
  <defs>
    <marker id="lanes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a2abbb" />
    </marker>
  </defs>
  <rect width="800" height="316" rx="14" fill="#1a1e27" />

  <!-- To sort -->
  <rect x="24" y="24" width="176" height="204" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="38" y="52" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">To sort</text>
  <rect x="34" y="72" width="156" height="64" rx="8" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="44" y="98" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eceff4">Christmas Eve</text>
  <text x="44" y="118" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">24 Dec 1975</text>
  <rect x="34" y="148" width="156" height="64" rx="8" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="44" y="174" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eceff4">Falmouth</text>
  <text x="44" y="194" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">3–9 Aug 1968</text>

  <!-- Everyday -->
  <rect x="216" y="24" width="176" height="204" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="230" y="52" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Everyday</text>
  <rect x="226" y="72" width="156" height="64" rx="8" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="236" y="98" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eceff4">Everyday</text>
  <text x="236" y="118" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">2014</text>
  <rect x="226" y="148" width="156" height="64" rx="8" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="236" y="174" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eceff4">Everyday</text>
  <text x="236" y="194" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">Jun 2015</text>

  <!-- Needs a date -->
  <rect x="408" y="24" width="176" height="204" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="422" y="52" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Needs a date</text>
  <rect x="418" y="72" width="156" height="64" rx="8" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="428" y="98" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eceff4">Undated</text>
  <text x="428" y="118" font-family="Fragment Mono, ui-monospace, monospace" font-size="13" fill="#a2abbb">box-3</text>
  <rect x="418" y="148" width="156" height="64" rx="8" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="428" y="174" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eceff4">1987</text>
  <text x="428" y="194" font-family="Fragment Mono, ui-monospace, monospace" font-size="13" fill="#a2abbb">box-3</text>

  <!-- Clutter -->
  <rect x="600" y="24" width="176" height="204" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="614" y="52" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Clutter</text>
  <rect x="610" y="72" width="156" height="64" rx="8" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="620" y="91" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eceff4">Screenshots and</text>
  <text x="620" y="108" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eceff4">saved images</text>
  <text x="620" y="126" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">2019</text>

  <!-- T: dated pictures join their events and days -->
  <path d="M496 228 V262 H112 V232" fill="none" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#lanes-arrow)" />
  <line x1="304" y1="262" x2="304" y2="232" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#lanes-arrow)" />
  <rect x="512" y="251" width="22" height="22" rx="5" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  <text x="523" y="267" text-anchor="middle" font-family="Fragment Mono, ui-monospace, monospace" font-size="13" fill="#eceff4">T</text>
  <text x="544" y="267" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">gives a time: they join</text>
  <text x="544" y="285" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">their events and days</text>
</svg>
