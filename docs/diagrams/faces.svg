<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" width="800" height="552">
  <title>Faces become people</title>
  <defs>
    <marker id="faces-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a2abbb" />
    </marker>
  </defs>
  <rect width="800" height="552" rx="14" fill="#1a1e27" />

  <!-- recognition -->
  <text x="24" y="46" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">Recognition decides</text>
  <rect x="296" y="64" width="208" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="400" y="89" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">A detected face</text>
  <text x="400" y="109" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">in a photo or a video</text>
  <line x1="360" y1="120" x2="150" y2="166" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#faces-arrow)" />
  <line x1="400" y1="120" x2="400" y2="166" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#faces-arrow)" />
  <line x1="440" y1="120" x2="650" y2="166" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#faces-arrow)" />

  <!-- Joins a person -->
  <rect x="24" y="168" width="240" height="104" rx="10" fill="#da77f2" fill-opacity="0.12" stroke="#da77f2" stroke-width="1.25" />
  <text x="44" y="196" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Joins a person</text>
  <text font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">
    <tspan x="44" y="220">looks clearly like their faces</tspan>
    <tspan x="44" y="238">in other photos, named or not</tspan>
  </text>
  <text x="44" y="258" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">never two faces of one photo</text>

  <!-- Starts a person -->
  <rect x="280" y="168" width="240" height="104" rx="10" fill="#da77f2" fill-opacity="0.12" stroke="#da77f2" stroke-width="1.25" />
  <text x="300" y="196" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Starts a person</text>
  <text font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">
    <tspan x="300" y="220">matches nobody, but is clear</tspan>
    <tspan x="300" y="238">and 48 px across or more</tspan>
  </text>
  <text x="300" y="258" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">Unknown 4XK9QM</text>

  <!-- Stays unknown -->
  <rect x="536" y="168" width="240" height="104" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="556" y="196" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Stays unknown</text>
  <text font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">
    <tspan x="556" y="220">too small or too unsure</tspan>
    <tspan x="556" y="238">to start anyone</tspan>
  </text>
  <text x="556" y="258" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">its box reads Unassigned</text>

  <!-- a person -->
  <text x="24" y="318" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">Then a person can</text>

  <!-- Who is this? -->
  <rect x="24" y="336" width="240" height="162" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="44" y="366" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Who is this?</text>
  <rect x="44" y="382" width="72" height="28" rx="14" fill="#40c057" fill-opacity="0.12" stroke="#40c057" stroke-width="1.25" />
  <text x="80.0" y="401.0" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#eceff4">Name</text>
  <rect x="44" y="418" width="172" height="28" rx="14" fill="#40c057" fill-opacity="0.12" stroke="#40c057" stroke-width="1.25" />
  <text x="130.0" y="437.0" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13"
    fill="#eceff4">Add to Ruby Wrenfield</text>
  <text font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">
    <tspan x="44" y="470">every face in the group</tspan>
    <tspan x="44" y="488">takes the name</tspan>
  </text>

  <!-- Take some faces out -->
  <rect x="280" y="336" width="240" height="162" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="300" y="366" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Take some faces out</text>
  <rect x="300" y="382" width="196" height="28" rx="14" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="398.0" y="401.0" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13"
    fill="#eceff4">Split off as someone new</text>
  <rect x="300" y="418" width="96" height="28" rx="14" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="348.0" y="437.0" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#eceff4">Move to…</text>
  <text font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">
    <tspan x="300" y="470">to a new person of their</tspan>
    <tspan x="300" y="488">own, or to one you pick</tspan>
  </text>

  <!-- Say what is not a person -->
  <rect x="536" y="336" width="240" height="162" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="556" y="366" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Say what is not a person</text>
  <rect x="556" y="382" width="120" height="28" rx="14" fill="#fd7e14" fill-opacity="0.12" stroke="#fd7e14" stroke-width="1.25" />
  <text x="616.0" y="401.0" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#eceff4">Not a person</text>
  <rect x="556" y="418" width="104" height="28" rx="14" fill="#fd7e14" fill-opacity="0.12" stroke="#fd7e14" stroke-width="1.25" />
  <text x="608.0" y="437.0" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#eceff4">Not a face</text>
  <text font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">
    <tspan x="556" y="470">locked without a name;</tspan>
    <tspan x="556" y="488">nothing is deleted</tspan>
  </text>

  <text x="400" y="530" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13"
    fill="#a2abbb">What a person decides is kept: recognition never undoes it.</text>
</svg>
