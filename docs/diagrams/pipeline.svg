<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 608" width="800" height="608">
  <title>From upload to findable</title>
  <defs>
    <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a2abbb" />
    </marker>
  </defs>
  <rect width="800" height="608" rx="14" fill="#1a1e27" />

  <!-- column headings -->
  <text x="24" y="48" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">Arrives</text>
  <text x="188" y="48" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">Read first</text>
  <text x="380" y="48" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">Then, side by side</text>
  <text x="628" y="48" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">Shows up in</text>

  <!-- the file -->
  <rect x="24" y="292" width="136" height="72" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="42" y="322" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">A file arrives</text>
  <text x="42" y="344" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#a2abbb">IMG_0042.jpg</text>
  <line x1="160" y1="328" x2="186" y2="328" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />

  <!-- media-ingest -->
  <rect x="188" y="276" width="152" height="104" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="206" y="306" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Its camera,</text>
  <text x="206" y="326" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">clocks and GPS</text>
  <text x="206" y="358" font-family="Fragment Mono, ui-monospace, monospace" font-size="13" fill="#7d8697">media-ingest</text>
  <text font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">
    <tspan x="188" y="406">every step on the right</tspan>
    <tspan x="188" y="424">waits for this one</tspan>
  </text>

  <!-- the fan-out -->
  <line x1="340" y1="328" x2="356" y2="328" stroke="#a2abbb" stroke-width="1.5" />
  <line x1="356" y1="96" x2="356" y2="560" stroke="#a2abbb" stroke-width="1.5" />

  <!-- media-interpret -->
  <line x1="356" y1="96" x2="378" y2="96" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="72" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="396" y="93" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Its date and place</text>
  <text x="396" y="111" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-interpret</text>
  <line x1="596" y1="96" x2="620" y2="96" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="101" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">Viewer, albums by day</text>

  <!-- media-stills -->
  <line x1="356" y1="154" x2="378" y2="154" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="130" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="396" y="151" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Thumbnails</text>
  <text x="396" y="169" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-stills</text>
  <line x1="596" y1="154" x2="620" y2="154" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="159" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">Grids and viewer</text>

  <!-- media-transcode -->
  <line x1="356" y1="212" x2="378" y2="212" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="188" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" stroke-dasharray="5 4" />
  <text x="396" y="209" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Video and sound to play</text>
  <text x="396" y="227" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-transcode</text>
  <line x1="596" y1="212" x2="620" y2="212" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="217" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">Viewer</text>

  <!-- media-faces -->
  <line x1="356" y1="270" x2="378" y2="270" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="246" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="396" y="267" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Faces, then people</text>
  <text x="396" y="285" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-faces</text>
  <line x1="596" y1="270" x2="620" y2="270" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="275" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">People</text>

  <!-- media-embed-picture -->
  <line x1="356" y1="328" x2="378" y2="328" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="304" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="396" y="325" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Picture vectors</text>
  <text x="396" y="343" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-embed-picture</text>
  <line x1="596" y1="328" x2="620" y2="328" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="333" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">Search</text>

  <!-- media-ocr -->
  <line x1="356" y1="386" x2="378" y2="386" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="362" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="396" y="383" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Text in the picture</text>
  <text x="396" y="401" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-ocr</text>
  <line x1="596" y1="386" x2="620" y2="386" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="391" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">Search, once filed</text>

  <!-- media-transcribe -->
  <line x1="356" y1="444" x2="378" y2="444" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="420" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" stroke-dasharray="5 4" />
  <text x="396" y="441" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Transcripts and voices</text>
  <text x="396" y="459" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-transcribe</text>
  <line x1="596" y1="444" x2="620" y2="444" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="449" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">Search, People</text>

  <!-- media-fingerprint -->
  <line x1="356" y1="502" x2="378" y2="502" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="478" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="396" y="499" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Fingerprints</text>
  <text x="396" y="517" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-fingerprint</text>
  <line x1="596" y1="502" x2="620" y2="502" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="507" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">Duplicates, stacks</text>

  <!-- media-geocode -->
  <line x1="356" y1="560" x2="378" y2="560" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <rect x="380" y="536" width="216" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="396" y="557" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Address and place</text>
  <text x="396" y="575" font-family="Fragment Mono, ui-monospace, monospace" font-size="12" fill="#7d8697">media-geocode</text>
  <line x1="596" y1="560" x2="620" y2="560" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#pipeline-arrow)" />
  <text x="628" y="565" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a2abbb">Viewer, Locations</text>

  <!-- legend -->
  <rect x="24" y="550" width="28" height="20" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" stroke-dasharray="5 4" />
  <text x="62" y="565" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">videos and recordings only</text>
</svg>
