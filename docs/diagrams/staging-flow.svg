<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 516" width="800" height="516">
  <title>A file's way through staging</title>
  <defs>
    <marker id="staging-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a2abbb" />
    </marker>
  </defs>
  <rect width="800" height="516" rx="14" fill="#1a1e27" />

  <!-- Ways in -->
  <rect x="24" y="24" width="170" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="109" y="53" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">Import media</text>
  <rect x="218" y="24" width="170" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="303" y="53" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">Drag and drop</text>
  <rect x="412" y="24" width="170" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="497" y="53" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">SFTP</text>
  <rect x="606" y="24" width="170" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="691" y="53" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">A zip or Takeout</text>

  <line x1="109" y1="72" x2="109" y2="118" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="303" y1="72" x2="303" y2="118" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="497" y1="72" x2="497" y2="118" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="691" y1="72" x2="691" y2="118" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />

  <!-- The staging area -->
  <rect x="24" y="96" width="752" height="214" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />

  <!-- A category folder -->
  <rect x="48" y="120" width="704" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="66" y="149" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">A category</text>
  <text x="160" y="149" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">Inbox, Scans, Google Photos export…</text>
  <text x="734" y="149" text-anchor="end" font-family="Fragment Mono, ui-monospace, monospace" font-size="13" fill="#7d8697">files/inbox/upload-2026-10-29/</text>

  <line x1="125" y1="168" x2="125" y2="194" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />

  <!-- The stages -->
  <rect x="48" y="196" width="155" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="64" y="222" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Arriving</text>
  <text x="64" y="243" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">from this browser</text>

  <rect x="231" y="196" width="155" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="247" y="222" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Being prepared</text>
  <text x="247" y="243" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">dates and places read</text>

  <rect x="414" y="196" width="155" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="430" y="222" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Being grouped</text>
  <text x="430" y="243" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">by the organizer</text>

  <rect x="597" y="196" width="155" height="60" rx="10" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="613" y="222" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Suggested album</text>
  <text x="613" y="243" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">in a lane</text>

  <line x1="203" y1="226" x2="229" y2="226" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="386" y1="226" x2="412" y2="226" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="569" y1="226" x2="595" y2="226" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />

  <text x="48" y="288" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Your staging area</text>
  <text x="188" y="288" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7d8697">only you can see it</text>

  <!-- The decisions -->
  <path d="M674.5 256 V332 M84 332 H712" fill="none" stroke="#a2abbb" stroke-width="1.5" />
  <line x1="84" y1="332" x2="84" y2="354" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="240" y1="332" x2="240" y2="354" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="402" y1="332" x2="402" y2="354" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="558" y1="332" x2="558" y2="354" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="712" y1="332" x2="712" y2="354" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />

  <rect x="24" y="356" width="120" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="84" y="383" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">New album</text>
  <rect x="160" y="356" width="160" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="240" y="383" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">New private album</text>
  <rect x="336" y="356" width="132" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="402" y="383" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">Add to album…</text>
  <rect x="484" y="356" width="148" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="558" y="383" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">Later</text>
  <rect x="648" y="356" width="128" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="712" y="383" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">Discard</text>

  <!-- Where they go -->
  <line x1="84" y1="400" x2="84" y2="426" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="240" y1="400" x2="240" y2="426" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="402" y1="400" x2="402" y2="426" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="558" y1="400" x2="558" y2="426" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />
  <line x1="712" y1="400" x2="712" y2="426" stroke="#a2abbb" stroke-width="1.5" marker-end="url(#staging-flow-arrow)" />

  <rect x="24" y="428" width="444" height="64" rx="10" fill="#339af0" fill-opacity="0.12" stroke="#339af0" stroke-width="1.25" />
  <text x="42" y="454" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#eceff4">The library</text>
  <text x="450" y="454" text-anchor="end" font-family="Fragment Mono, ui-monospace, monospace" font-size="13" fill="#7d8697">/archive/albums</text>
  <text x="42" y="476" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13"
    fill="#a2abbb">shared as its album is; a private one with you alone</text>

  <rect x="484" y="428" width="148" height="64" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" stroke-dasharray="5 4" />
  <text x="558" y="454" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">Still in staging</text>
  <text x="558" y="476" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">the Later lane</text>

  <rect x="648" y="428" width="128" height="64" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.25" />
  <text x="712" y="454" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600"
    fill="#eceff4">Your trash</text>
  <text x="712" y="476" text-anchor="middle" font-family="Familjen Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#a2abbb">Undo restores it</text>
</svg>
